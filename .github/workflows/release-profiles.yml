# Builds and releases Medic Profiles when you push a tag like profiles-v1.0.0,
# then adds it to manifest.json beside Jellyfin Medic.
# Jellyfin Medic keeps its own release.yml and its v1.x.x tags; this file doesn't touch them.
# Profiles releases are never marked "Latest", so the repo page keeps showing Jellyfin Medic.

name: Release Medic Profiles

on:
  push:
    tags:
      - 'profiles-v*'

permissions:
  contents: write

concurrency:
  group: manifest-update
  cancel-in-progress: false

env:
  PROJECT: 'Jellyfin.Plugin.MedicProfiles/Jellyfin.Plugin.MedicProfiles.csproj'
  CHANGELOG_FILE: 'Jellyfin.Plugin.MedicProfiles/CHANGELOG.md'
  DLL: 'Jellyfin.Plugin.MedicProfiles.dll'
  GUID: '1eb65368-7b2e-4a55-8f2b-b56134f3fe68'
  NAME: 'Medic Profiles'
  OWNER: 'P1zzm1ssile'
  TARGET_ABI: '12.0.0.0'   # built against Jellyfin 12.0, so it loads on 12.0 and 12.1
  DESCRIPTION: "Sonarr and Radarr from your Jellyfin dashboard: downloads, fixes and profile advice."
  OVERVIEW: "See what Sonarr and Radarr are downloading, remove, block or import stuck and wrong downloads by hand, and get quality profile advice from what your server actually plays."
  IMAGE: 'https://raw.githubusercontent.com/P1zzm1ssile/Jellyfin-Medic/main/Jellyfin.Plugin.MedicProfiles/thumb.png'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version from the tag
        id: meta
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#profiles-v}"
          # Digits and dots only: the version ends up in file names, commands and the manifest.
          if ! [[ "$VER" =~ ^[0-9]+(\.[0-9]+){2,3}$ ]]; then
            echo "::error::Tag must look like profiles-v1.2.3 (got $GITHUB_REF_NAME)"
            exit 1
          fi
          IFS='.' read -r A B C D <<< "$VER"
          VER4="${A:-0}.${B:-0}.${C:-0}.${D:-0}"
          echo "version=$VER4" >> "$GITHUB_OUTPUT"
          echo "zip=MedicProfiles-v${VER}.zip" >> "$GITHUB_OUTPUT"
          if [ "${A:-0}" = "0" ]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"

      - name: Check the tag matches the project version
        shell: bash
        env:
          WANT: ${{ steps.meta.outputs.version }}
        run: |
          HAVE="$(grep -oP '(?<=<Version>)[^<]+' "$PROJECT" | head -1)"
          if [ "$WANT" != "$HAVE" ]; then
            echo "::error::Tag $GITHUB_REF_NAME is $WANT but $PROJECT says $HAVE. Tag the commit that has the new version."
            exit 1
          fi
          # And it must be on main: a branch that already has the new version but isn't merged would pass the check above.
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is on a commit that isn't on main. Merge first, then tag the merged commit."
            exit 1
          fi
          # The release notes and the manifest's changelog are this version's section of the changelog.
          if ! python3 scripts/changelog_section.py "$CHANGELOG_FILE" "${GITHUB_REF_NAME#profiles-v}" > CHANGES.md; then
            echo "::error::$CHANGELOG_FILE has no section for ${GITHUB_REF_NAME#profiles-v}. Add it, merge, then tag."
            exit 1
          fi

      - name: Build
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          dotnet publish "$PROJECT" -c Release -o out \
            -p:JellyfinTarget=12 \
            -p:Version="$VERSION" \
            -p:AssemblyVersion="$VERSION" \
            -p:FileVersion="$VERSION"

      - name: Package
        id: pkg
        shell: bash
        env:
          ZIP: ${{ steps.meta.outputs.zip }}
        run: |
          zip -j "$ZIP" "out/$DLL"
          echo "md5=$(md5sum "$ZIP" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          ZIP: ${{ steps.meta.outputs.zip }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          PRE=""
          [ "$PRERELEASE" = "true" ] && PRE="--prerelease"
          # The release may already exist if it was made on GitHub's Releases page (which creates
          # the tag): then add the zip to it and fill in its title and notes instead.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$NAME $VERSION" \
              --notes-file CHANGES.md --latest=false $PRE
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" \
              --title "$NAME $VERSION" \
              --notes-file CHANGES.md --latest=false $PRE
          fi

      - name: Add the version to manifest.json on main
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          ZIP: ${{ steps.meta.outputs.zip }}
          MD5: ${{ steps.pkg.outputs.md5 }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python3 scripts/update_manifest.py \
            --guid "$GUID" \
            --name "$NAME" \
            --version "$VERSION" \
            --abi "$TARGET_ABI" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$ZIP" \
            --checksum "$MD5" \
            --changelog-file CHANGES.md \
            --owner "$OWNER" \
            --description "$DESCRIPTION" \
            --overview "$OVERVIEW" \
            --image-url "$IMAGE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "manifest: $NAME $VERSION"
          # Fail if no push gets through, instead of ending green on the last pull's status.
          for _ in 1 2 3; do
            if git push origin main; then exit 0; fi
            git pull --rebase origin main
          done
          echo "::error::Couldn't push manifest.json to main after 3 tries; this release isn't in the manifest."
          exit 1
